[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-notes"
version = "0.2.0"
description = "把 B 站讲解视频整理成个人知识库"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
claude = ["anthropic>=1.8"]
all = ["bili-notes[asr,claude]"]
dev = ["pytest>=8"]

[project.scripts]
bili-notes = "bili_notes.cli:main"

[tool.setuptools]
packages = ["bili_notes"]

[tool.setuptools.package-data]
bili_notes = ["templates/*.html", "static/*"]
