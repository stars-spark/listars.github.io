{% extends "base.html" %}
{% block title %}登录 · B站笔记{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>登录</h1>
  {% if error %}<p class="flash err">密码不对</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <input name="password" type="password" placeholder="APP_PASSWORD" autocomplete="current-password" required autofocus>
    <button class="primary">进入</button>
  </form>
</section>
{% endblock %}
